workflows:
  ios-offline-unsigned:
    name: GameLingo Offline iPhone - unsigned IPA for Windows sideload
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
    scripts:
      - name: Prepare build identity and project
        script: |
          set -e
          python3 tools/prepare_build.py
          python3 tools/build_xcodeproj.py
      - name: Compile iOS app and ReplayKit extension (no code signing)
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/artifacts"
          BUILD_LOG="$CM_BUILD_DIR/artifacts/xcodebuild.log"
          echo "Building latest commit: ${CM_COMMIT:-unknown}"
          if xcodebuild \
            -project "$CM_BUILD_DIR/GameLingoAI.xcodeproj" \
            -scheme GameLingoAI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/Build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > "$BUILD_LOG" 2>&1; then
            echo "Xcode build succeeded"
            tail -n 30 "$BUILD_LOG"
          else
            echo "===== Swift/Xcode compiler diagnostics ====="
            grep -nE 'error:|warning:|does not conform|failed' "$BUILD_LOG" | tail -n 90 || true
            echo "===== Final 80 build lines ====="
            tail -n 80 "$BUILD_LOG"
            echo "Full build log: artifacts/xcodebuild.log"
            exit 65
          fi
      - name: Export unsigned IPA
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/artifacts/Payload"
          cp -R "$CM_BUILD_DIR/Build/Build/Products/Release-iphoneos/GameLingoAI.app" \
            "$CM_BUILD_DIR/artifacts/Payload/GameLingoAI.app"
          cd "$CM_BUILD_DIR/artifacts"
          /usr/bin/zip -qr GameLingoAI-Offline-unsigned.ipa Payload
          rm -rf Payload
    artifacts:
      - artifacts/xcodebuild.log
      - artifacts/GameLingoAI-Offline-unsigned.ipa
      - Build/Logs/Build/*.xcactivitylog
