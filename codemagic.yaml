workflows:
  ios-offline-unsigned:
    name: GameLingo Offline iPhone - unsigned IPA for Windows sideload
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
    scripts:
      - name: Prepare build identity and project
        script: |
          set -e
          python3 tools/prepare_build.py
          python3 tools/build_xcodeproj.py
      - name: Compile iOS app and ReplayKit extension (no code signing)
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/artifacts"
          BUILD_LOG="$CM_BUILD_DIR/artifacts/xcodebuild.log"
          echo "Building commit: ${CM_COMMIT:-unknown}"
          if xcodebuild \
            -project "$CM_BUILD_DIR/GameLingoAI.xcodeproj" \
            -scheme GameLingoAI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/Build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > "$BUILD_LOG" 2>&1; then
            echo "Xcode build succeeded"
            tail -n 30 "$BUILD_LOG"
          else
            echo "===== Swift/Xcode compiler diagnostics ====="
            grep -nE 'error:|warning:|does not conform|failed' "$BUILD_LOG" | tail -n 90 || true
            tail -n 80 "$BUILD_LOG"
            exit 65
          fi
      - name: Export unsigned IPA
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/artifacts/Payload"
          cp -R "$CM_BUILD_DIR/Build/Build/Products/Release-iphoneos/GameLingoAI.app" \
            "$CM_BUILD_DIR/artifacts/Payload/GameLingoAI.app"
          cd "$CM_BUILD_DIR/artifacts"
          /usr/bin/zip -qr GameLingoAI-Offline-unsigned.ipa Payload
          rm -rf Payload
    artifacts:
      - artifacts/xcodebuild.log
      - artifacts/GameLingoAI-Offline-unsigned.ipa
      - Build/Logs/Build/*.xcactivitylog

  ios-direct-unsigned:
    name: GameLingo iOS 27 direct capture - no App Groups or extension
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: '27.1'
    scripts:
      - name: Generate single-target Xcode project
        script: |
          set -e
          python3 tools/prepare_build.py
          GAMELINGO_DIRECT_CAPTURE=1 python3 tools/build_xcodeproj.py
          python3 tools/verify_direct_release.py
          echo "Type-checking Foundation-only OCR quality module"
          xcrun swiftc -typecheck ios/GameLingoAI/GameOCRQuality.swift
          echo "Typechecking off-main CoreText video renderer on the build Mac"
          xcrun swiftc -typecheck ios/GameLingoAI/GamePiPFrameRenderer.swift
          xcrun swiftc -typecheck ios/GameLingoAI/GameGlossaryTXTParser.swift
          echo "Testing TXT glossary UTF-8, UTF-16 and collision handling"
          xcrun swiftc ios/GameLingoAI/GameGlossaryTXTParser.swift tests/glossary_txt_smoke.swift -o /tmp/gamelingo-glossary-smoke
          /tmp/gamelingo-glossary-smoke
          echo "Checking automatic Vision language selection and local source detection"
          xcrun swiftc ios/GameLingoAI/GameLanguageSupport.swift tests/auto_language_smoke.swift -o /tmp/gamelingo-auto-language-smoke
          /tmp/gamelingo-auto-language-smoke
          echo "Running Japanese OCR smoke tests on build Mac"
          xcrun swiftc ios/GameLingoAI/GameOCRQuality.swift tests/ocr_quality_smoke.swift -o /tmp/gamelingo-ocr-smoke
          /tmp/gamelingo-ocr-smoke
          echo "Checking Swift syntax before full Xcode compilation"
          xcrun swiftc -frontend -parse -D DIRECT_CAPTURE \
            ios/GameLingoAI/GameLingoAIApp.swift \
            ios/GameLingoAI/GameLingoStore.swift \
            ios/GameLingoAI/GameOnlineTranslation.swift \
            ios/GameLingoAI/GameGlossaryTXTParser.swift \
            ios/GameLingoAI/GameGlossaryLibrary.swift \
            ios/GameLingoAI/GameGlossaryLibraryView.swift \
            ios/GameLingoAI/GameLanguageSupport.swift \
            ios/GameLingoAI/GameOCRQuality.swift \
            ios/GameLingoAI/GameRPGDictionary.swift \
            ios/GameLingoAI/GameRPGDictionaryView.swift \
            ios/GameLingoAI/GameTranslationSettingsView.swift \
            ios/GameLingoAI/GameCaptureGeometry.swift \
            ios/GameLingoAI/GameMenuCatalog.swift \
            ios/GameLingoAI/DirectHomeView.swift \
            ios/GameLingoAI/DirectGameCapture.swift \
            ios/GameLingoAI/FloatingSubtitleController.swift \
            ios/GameLingoAI/GamePiPFrameRenderer.swift
      - name: Compile direct-capture iPhone app
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/artifacts"
          BUILD_LOG="$CM_BUILD_DIR/artifacts/xcodebuild-direct.log"
          echo "Building commit: ${CM_COMMIT:-unknown}"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          SDK_MAJOR="$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)"
          if [ "$SDK_MAJOR" -lt 27 ]; then
            echo "ERROR: Direct iOS 27 ScreenCaptureKit requires Xcode 27 SDK or later"
            exit 1
          fi
          if xcodebuild \
            -project "$CM_BUILD_DIR/GameLingoAI.xcodeproj" \
            -scheme GameLingoAI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/Build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > "$BUILD_LOG" 2>&1; then
            echo "Build succeeded"
            tail -n 30 "$BUILD_LOG"
          else
            echo "===== PRIMARY SWIFT ERRORS (WITH CONTEXT) ====="
            ERROR_FILE="$CM_BUILD_DIR/artifacts/compiler-errors-direct.txt"
            awk '
              /error:|does not conform|ambiguous use of|no member|cannot convert|missing argument/ {
                start = NR - 3
                if (start < 1) start = 1
                for (i = start; i < NR; i++) if (i in prev) print prev[i]
                print NR ":" $0
                trailing = 7
                found = 1
              }
              trailing > 0 && !/error:|does not conform|ambiguous use of|no member|cannot convert|missing argument/ {
                print NR ":" $0
                trailing--
              }
              {
                prev[NR] = NR ":" $0
                delete prev[NR - 3]
              }
              END {
                if (!found) print "No compiler error line found in text output; attach xcodebuild-direct.log"
              }
            ' "$BUILD_LOG" > "$ERROR_FILE"
            echo "===== FIRST 100 COMPILER DIAGNOSTIC LINES ====="
            head -n 100 "$ERROR_FILE"
            echo "===== BUILD SUMMARY ====="
            tail -n 18 "$BUILD_LOG"
            echo "For support: download artifacts/compiler-errors-direct.txt"
            exit 65
          fi
      - name: Verify app has no shared-container entitlement or app extension
        script: |
          set -e
          APP="$CM_BUILD_DIR/Build/Build/Products/Release-iphoneos/GameLingoAI.app"
          REPORT="$CM_BUILD_DIR/artifacts/direct-package-audit.txt"
          test -d "$APP" || { echo "App bundle was not built"; exit 1; }
          {
            echo "Bundle identifier:"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
            echo "Display name:"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist"
            echo "Embedded extensions:"
            find "$APP" -type d -name '*.appex' -print
          } > "$REPORT"
          if find "$APP" -type d -name '*.appex' | grep -q .; then
            echo "FAIL: direct IPA unexpectedly includes app extensions"
            cat "$REPORT"
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups' "$APP/Info.plist" >/dev/null 2>&1; then
            echo "FAIL: shared app group requested by app Info.plist"
            exit 1
          fi
          grep -q 'com.example.GameLingoAI.direct' "$REPORT" || {
            echo "FAIL: wrong bundle ID; SideStore could be reinstalling legacy app"
            cat "$REPORT"
            exit 1
          }
          echo "PASS: no broadcast extension, distinct app identity" | tee -a "$REPORT"
      - name: Package unsigned IPA for SideStore
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/artifacts/Payload"
          cp -R "$CM_BUILD_DIR/Build/Build/Products/Release-iphoneos/GameLingoAI.app" "$CM_BUILD_DIR/artifacts/Payload/GameLingoAI.app"
          cd "$CM_BUILD_DIR/artifacts"
          /usr/bin/zip -qr GameLingoAI-Direct-iOS27-unsigned.ipa Payload
          rm -rf Payload
    artifacts:
      - artifacts/GameLingoAI-Direct-iOS27-unsigned.ipa
      - artifacts/direct-package-audit.txt
      - artifacts/compiler-errors-direct.txt
      - artifacts/xcodebuild-direct.log


  ios-universal-ocr-unsigned:
    name: '03 | UNIVERSAL TRANSLATOR v3.8.1 (Build 19) | portrait PiP | unsigned'
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: '27.1'
    scripts:
      - name: Generate experimental iOS 27 app
        script: |
          set -e
          python3 tools/prepare_build.py
          GAMELINGO_DIRECT_CAPTURE=1 GAMELINGO_ENABLE_PADDLE=1 python3 tools/build_xcodeproj.py
          python3 tools/verify_direct_release.py
          python3 tools/verify_universal_ocr.py
          echo "Running original OCR quality smoke tests"
          xcrun swiftc ios/GameLingoAI/GameOCRQuality.swift tests/ocr_quality_smoke.swift -o /tmp/gamelingo-ocr-smoke
          /tmp/gamelingo-ocr-smoke
          echo "Running automatic language smoke tests"
          xcrun swiftc ios/GameLingoAI/GameLanguageSupport.swift tests/auto_language_smoke.swift -o /tmp/gamelingo-auto-smoke
          /tmp/gamelingo-auto-smoke
          echo "Running Universal OCR router smoke tests"
          xcrun swiftc ios/GameLingoAI/GameOCRRouting.swift tests/universal_ocr_routing_smoke.swift -o /tmp/gamelingo-universal-smoke
          /tmp/gamelingo-universal-smoke
          echo "Testing OCR recovery budget and safe automatic source language"
          xcrun swiftc ios/GameLingoAI/GameOCRSessionPolicy.swift tests/ocr_session_policy_smoke.swift -o /tmp/gamelingo-ocr-session-smoke
          /tmp/gamelingo-ocr-session-smoke
          echo "Testing user-locale language and provider normalization"
          xcrun swiftc ios/GameLingoAI/GameTranslationLanguages.swift tests/translation_languages_smoke.swift -o /tmp/gamelingo-i18n-smoke
          /tmp/gamelingo-i18n-smoke
          echo "Testing full-window paired PiP pagination"
          xcrun swiftc ios/GameLingoAI/GamePiPReadingLayout.swift tests/pip_reading_smoke.swift -o /tmp/gamelingo-pip-smoke
          /tmp/gamelingo-pip-smoke
          echo "Testing portrait PiP crop and OCR-position coordinates"
          xcrun swiftc ios/GameLingoAI/GamePiPSceneLayout.swift tests/pip_scene_smoke.swift -o /tmp/gamelingo-scene-smoke
          /tmp/gamelingo-scene-smoke
          echo "Testing translation backoff after repeated provider failures"
          xcrun swiftc ios/GameLingoAI/GameTranslationBackoff.swift tests/translation_backoff_smoke.swift -o /tmp/gamelingo-translation-backoff-smoke
          /tmp/gamelingo-translation-backoff-smoke
          echo "Typechecking Foundation-only diagnostics and backoff"
          xcrun swiftc -typecheck ios/GameLingoAI/GameDiagnosticLog.swift ios/GameLingoAI/GameTranslationBackoff.swift
          echo "Swift syntax check (adapter's conditional compilation)"
          xcrun swiftc -frontend -parse -D PADDLE_OCR ios/GameLingoAI/GamePaddleOCR.swift
          xcrun swiftc -frontend -parse ios/GameLingoAI/GameLanguagePackView.swift
          xcrun swiftc -frontend -parse ios/GameLingoAI/GameTranslationLanguages.swift
          xcrun swiftc -frontend -parse ios/GameLingoAI/GameOnlineTranslation.swift
          xcrun swiftc -frontend -parse ios/GameLingoAI/GameMenuCatalog.swift
          xcrun swiftc -frontend -parse ios/GameLingoAI/GameLingoStore.swift
          xcrun swiftc -frontend -parse ios/GameLingoAI/GameStartupWarmup.swift
          xcrun swiftc -frontend -parse -D DIRECT_CAPTURE ios/GameLingoAI/FloatingSubtitleController.swift
          xcrun swiftc -frontend -parse ios/GameLingoAI/GamePiPSceneLayout.swift
          xcrun swiftc -frontend -parse ios/GameLingoAI/GamePiPFrameRenderer.swift
          xcrun swiftc -frontend -parse -D DIRECT_CAPTURE ios/GameLingoAI/DirectHomeView.swift
          xcrun swiftc -frontend -parse -D DIRECT_CAPTURE -D PADDLE_OCR ios/GameLingoAI/DirectGameCapture.swift
      - name: Fetch official PP-OCRv6 Small recognition weights
        script: |
          set -e
          ruby tests/paddle_yaml_alias_smoke.rb
          bash tools/fetch_paddle_rec_model.sh
          test -s ios/GameLingoAI/PaddleModels/rec/inference.onnx
          test -s ios/GameLingoAI/PaddleModels/rec/characters.txt
      - name: Install PaddleOCR ONNX model and runtime
        script: |
          set -e
          command -v pod >/dev/null || { echo "CocoaPods is missing from this Codemagic image"; exit 1; }
          pod install --repo-update
          test -d GameLingoAI.xcworkspace || { echo "Pod installation did not generate workspace"; exit 1; }
          echo "Checking CocoaPods deployment targets for Xcode 27 compatibility"
          python3 - <<'PY'
          import re
          from pathlib import Path

          pbxproj = Path("Pods/Pods.xcodeproj/project.pbxproj")
          if not pbxproj.is_file():
              raise SystemExit("Pods project missing after pod install")
          content = pbxproj.read_text(encoding="utf-8")
          versions = re.findall(r'IPHONEOS_DEPLOYMENT_TARGET\s*=\s*"?([0-9]+(?:\.[0-9]+)*)"?\s*;', content)
          if not versions:
              raise SystemExit("No pod deployment targets found; cannot verify compatibility")
          old_targets = sorted({v for v in versions if int(v.split(".")[0]) < 15})
          if old_targets:
              raise SystemExit(f"Unsupported iOS deployment targets in Pods: {', '.join(old_targets)}")
          print(f"PASS: {len(versions)} CocoaPods deployment settings support iOS 15+")
          PY
      - name: Build unsigned experimental iPhone app
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/artifacts"
          BUILD_LOG="$CM_BUILD_DIR/artifacts/xcodebuild-universal.log"
          if xcodebuild \
            -workspace "$CM_BUILD_DIR/GameLingoAI.xcworkspace" \
            -scheme GameLingoAI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/Build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > "$BUILD_LOG" 2>&1; then
            tail -n 35 "$BUILD_LOG"
          else
            echo "===== UNIVERSAL OCR SWIFT/COCOAPODS ERRORS ====="
            grep -n -E 'error:|could not|Unable to find|No such module|BUILD FAILED' "$BUILD_LOG" | head -n 85 || true
            tail -n 40 "$BUILD_LOG"
            exit 65
          fi
      - name: Validate and package Universal OCR IPA
        script: |
          set -e
          APP="$CM_BUILD_DIR/Build/Build/Products/Release-iphoneos/GameLingoAI.app"
          test -d "$APP"
          test -s "$APP/PaddleModels/rec/inference.onnx" || { echo "Paddle model missing from IPA!"; exit 1; }
          test -s "$APP/PaddleModels/rec/characters.txt" || { echo "Paddle vocabulary missing from IPA!"; exit 1; }
          test ! -d "$APP/PlugIns"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -q '^3.8.1$'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -q '^19$'
          mkdir -p "$CM_BUILD_DIR/artifacts/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/artifacts/Payload/GameLingoAI.app"
          cd "$CM_BUILD_DIR/artifacts"
          /usr/bin/zip -qr GameLingoAI-Universal-v3.8.1-b19-portrait-unsigned.ipa Payload
          rm -rf Payload
    artifacts:
      - artifacts/GameLingoAI-Universal-v3.8.1-b19-portrait-unsigned.ipa
      - artifacts/xcodebuild-universal.log
