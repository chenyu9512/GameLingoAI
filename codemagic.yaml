workflows:
  ios-offline-unsigned:
    name: '99 | LEGACY v2.0.0 (Build 1) | ReplayKit / iOS 26 | unsigned'
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
    scripts:
      - name: Prepare build identity and project
        script: |
          set -e
          python3 tools/prepare_build.py
          python3 tools/build_xcodeproj.py
      - name: Compile iOS app and ReplayKit extension (no code signing)
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/artifacts"
          BUILD_LOG="$CM_BUILD_DIR/artifacts/xcodebuild.log"
          echo "Building commit: ${CM_COMMIT:-unknown}"
          if xcodebuild \
            -project "$CM_BUILD_DIR/GameLingoAI.xcodeproj" \
            -scheme GameLingoAI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/Build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > "$BUILD_LOG" 2>&1; then
            echo "Xcode build succeeded"
            tail -n 30 "$BUILD_LOG"
          else
            echo "===== Swift/Xcode compiler diagnostics ====="
            grep -nE 'error:|warning:|does not conform|failed' "$BUILD_LOG" | tail -n 90 || true
            tail -n 80 "$BUILD_LOG"
            exit 65
          fi
      - name: Export unsigned IPA
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/artifacts/Payload"
          cp -R "$CM_BUILD_DIR/Build/Build/Products/Release-iphoneos/GameLingoAI.app" \
            "$CM_BUILD_DIR/artifacts/Payload/GameLingoAI.app"
          cd "$CM_BUILD_DIR/artifacts"
          /usr/bin/zip -qr GameLingoAI-ReplayKit-v2.0.0-b1-legacy-unsigned.ipa Payload
          rm -rf Payload
    artifacts:
      - artifacts/xcodebuild.log
      - artifacts/GameLingoAI-ReplayKit-v2.0.0-b1-legacy-unsigned.ipa
      - Build/Logs/Build/*.xcactivitylog

  ios-direct-unsigned:
    name: '01 | MAIN v3.5.3 (Build 14) | Direct / iOS 27 | unsigned'
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: '27.1'
    scripts:
      - name: Generate single-target Xcode project
        script: |
          set -e
          python3 tools/prepare_build.py
          GAMELINGO_DIRECT_CAPTURE=1 python3 tools/build_xcodeproj.py
          python3 tools/verify_direct_release.py
          echo "Type-checking Foundation-only OCR quality module"
          xcrun swiftc -typecheck ios/GameLingoAI/GameOCRQuality.swift
          echo "Typechecking off-main CoreText video renderer on the build Mac"
          xcrun swiftc -typecheck ios/GameLingoAI/GamePiPFrameRenderer.swift
          xcrun swiftc -typecheck ios/GameLingoAI/GameGlossaryTXTParser.swift
          echo "Testing TXT glossary UTF-8, UTF-16 and collision handling"
          xcrun swiftc ios/GameLingoAI/GameGlossaryTXTParser.swift tests/glossary_txt_smoke.swift -o /tmp/gamelingo-glossary-smoke
          /tmp/gamelingo-glossary-smoke
          echo "Checking automatic Vision language selection and local source detection"
          xcrun swiftc ios/GameLingoAI/GameLanguageSupport.swift tests/auto_language_smoke.swift -o /tmp/gamelingo-auto-language-smoke
          /tmp/gamelingo-auto-language-smoke
          echo "Testing language stability and translation failure backoff"
          xcrun swiftc ios/GameLingoAI/GameTranslationSafety.swift tests/translation_safety_smoke.swift -o /tmp/gamelingo-translation-safety-smoke
          /tmp/gamelingo-translation-safety-smoke
          echo "Running Japanese OCR smoke tests on build Mac"
          xcrun swiftc ios/GameLingoAI/GameOCRQuality.swift tests/ocr_quality_smoke.swift -o /tmp/gamelingo-ocr-smoke
          /tmp/gamelingo-ocr-smoke
          echo "Checking Swift syntax before full Xcode compilation"
          xcrun swiftc -frontend -parse -D DIRECT_CAPTURE \
            ios/GameLingoAI/GameLingoAIApp.swift \
            ios/GameLingoAI/GameLingoStore.swift \
            ios/GameLingoAI/GameOnlineTranslation.swift \
            ios/GameLingoAI/GameGlossaryTXTParser.swift \
            ios/GameLingoAI/GameGlossaryLibrary.swift \
            ios/GameLingoAI/GameGlossaryLibraryView.swift \
            ios/GameLingoAI/GameLanguageSupport.swift \
            ios/GameLingoAI/GameTranslationSafety.swift \
            ios/GameLingoAI/GameOCRQuality.swift \
            ios/GameLingoAI/GameRPGDictionary.swift \
            ios/GameLingoAI/GameRPGDictionaryView.swift \
            ios/GameLingoAI/GameTranslationSettingsView.swift \
            ios/GameLingoAI/GameCaptureGeometry.swift \
            ios/GameLingoAI/GameMenuCatalog.swift \
            ios/GameLingoAI/DirectHomeView.swift \
            ios/GameLingoAI/DirectGameCapture.swift \
            ios/GameLingoAI/FloatingSubtitleController.swift \
            ios/GameLingoAI/GamePiPFrameRenderer.swift
      - name: Compile direct-capture iPhone app
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/artifacts"
          BUILD_LOG="$CM_BUILD_DIR/artifacts/xcodebuild-direct.log"
          echo "Building commit: ${CM_COMMIT:-unknown}"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          SDK_MAJOR="$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)"
          if [ "$SDK_MAJOR" -lt 27 ]; then
            echo "ERROR: Direct iOS 27 ScreenCaptureKit requires Xcode 27 SDK or later"
            exit 1
          fi
          if xcodebuild \
            -project "$CM_BUILD_DIR/GameLingoAI.xcodeproj" \
            -scheme GameLingoAI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/Build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > "$BUILD_LOG" 2>&1; then
            echo "Build succeeded"
            tail -n 30 "$BUILD_LOG"
          else
            echo "===== PRIMARY SWIFT ERRORS (WITH CONTEXT) ====="
            ERROR_FILE="$CM_BUILD_DIR/artifacts/compiler-errors-direct.txt"
            awk '
              /error:|does not conform|ambiguous use of|no member|cannot convert|missing argument/ {
                start = NR - 3
                if (start < 1) start = 1
                for (i = start; i < NR; i++) if (i in prev) print prev[i]
                print NR ":" $0
                trailing = 7
                found = 1
              }
              trailing > 0 && !/error:|does not conform|ambiguous use of|no member|cannot convert|missing argument/ {
                print NR ":" $0
                trailing--
              }
              {
                prev[NR] = NR ":" $0
                delete prev[NR - 3]
              }
              END {
                if (!found) print "No compiler error line found in text output; attach xcodebuild-direct.log"
              }
            ' "$BUILD_LOG" > "$ERROR_FILE"
            echo "===== FIRST 100 COMPILER DIAGNOSTIC LINES ====="
            head -n 100 "$ERROR_FILE"
            echo "===== BUILD SUMMARY ====="
            tail -n 18 "$BUILD_LOG"
            echo "For support: download artifacts/compiler-errors-direct.txt"
            exit 65
          fi
      - name: Verify app has no shared-container entitlement or app extension
        script: |
          set -e
          APP="$CM_BUILD_DIR/Build/Build/Products/Release-iphoneos/GameLingoAI.app"
          REPORT="$CM_BUILD_DIR/artifacts/direct-package-audit.txt"
          test -d "$APP" || { echo "App bundle was not built"; exit 1; }
          {
            echo "Bundle identifier:"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
            echo "Display name:"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist"
            echo "Embedded extensions:"
            find "$APP" -type d -name '*.appex' -print
          } > "$REPORT"
          if find "$APP" -type d -name '*.appex' | grep -q .; then
            echo "FAIL: direct IPA unexpectedly includes app extensions"
            cat "$REPORT"
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups' "$APP/Info.plist" >/dev/null 2>&1; then
            echo "FAIL: shared app group requested by app Info.plist"
            exit 1
          fi
          grep -q 'com.example.GameLingoAI.direct' "$REPORT" || {
            echo "FAIL: wrong bundle ID; SideStore could be reinstalling legacy app"
            cat "$REPORT"
            exit 1
          }
          echo "PASS: no broadcast extension, distinct app identity" | tee -a "$REPORT"
      - name: Package unsigned IPA for SideStore
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/artifacts/Payload"
          cp -R "$CM_BUILD_DIR/Build/Build/Products/Release-iphoneos/GameLingoAI.app" "$CM_BUILD_DIR/artifacts/Payload/GameLingoAI.app"
          cd "$CM_BUILD_DIR/artifacts"
          /usr/bin/zip -qr GameLingoAI-Direct-v3.5.3-b14-unsigned.ipa Payload
          rm -rf Payload
    artifacts:
      - artifacts/GameLingoAI-Direct-v3.5.3-b14-unsigned.ipa
      - artifacts/direct-package-audit.txt
      - artifacts/compiler-errors-direct.txt
      - artifacts/xcodebuild-direct.log
